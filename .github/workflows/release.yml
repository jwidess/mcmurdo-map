name: Release & Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-apk:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || needs.release-please.outputs.release_created == true || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease -PversionName=${{ needs.release-please.outputs.version || 'test-build' }}

      - name: Prepare APK artifact
        run: cp app/build/outputs/apk/release/app-release.apk McMurdoStationMap.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v7
        with:
          name: McMurdoStationMap-${{ needs.release-please.outputs.tag_name || 'test-build' }}
          path: McMurdoStationMap.apk

      - name: Upload APK to GitHub Release
        if: ${{ needs.release-please.outputs.release_created == 'true' || needs.release-please.outputs.release_created == true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.release-please.outputs.tag_name }} McMurdoStationMap.apk --clobber
