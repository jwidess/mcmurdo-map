name: Release & Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-apk:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || needs.release-please.outputs.release_created == true || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APKs
        run: ./gradlew assembleRelease -PversionName=${{ needs.release-please.outputs.version || 'test-build' }}

      - name: Prepare APK artifacts
        run: |
          cp app/build/outputs/apk/full/release/app-full-release.apk McMurdoStationMap-full.apk
          cp app/build/outputs/apk/slim/release/app-slim-release.apk McMurdoStationMap-slim.apk

      - name: Upload Full APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: McMurdoStationMap-full-${{ needs.release-please.outputs.tag_name || 'test-build' }}
          path: McMurdoStationMap-full.apk

      - name: Upload Slim APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: McMurdoStationMap-slim-${{ needs.release-please.outputs.tag_name || 'test-build' }}
          path: McMurdoStationMap-slim.apk

      - name: Update GitHub Release with Variant Info & Upload APKs
        if: ${{ needs.release-please.outputs.release_created == 'true' || needs.release-please.outputs.release_created == true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"

          # Fetch current release notes generated by release-please
          gh release view "$TAG" --json body --template '{{.body}}' > /tmp/existing_notes.md || true

          # Add variant guide if not already added
          if ! grep -q "### APK Variants" /tmp/existing_notes.md 2>/dev/null; then
            {
              echo "### APK Variants"
              echo ""
              echo "- **Full Edition (\`McMurdoStationMap-full.apk\`)** (~29.5 MB)"
              echo "  Includes all 103 station photos, full map, building directory, and **all 82 building information sheets (PDFs)**."
              echo "- **Slim Edition (\`McMurdoStationMap-slim.apk\`)** (~16.4 MB)"
              echo "  Includes all 103 station photos, full map, building directory, but **NO PDF building information sheets** to reduce download size."
              echo ""
              echo "---"
              echo ""
              cat /tmp/existing_notes.md
            } > /tmp/release_notes.md
            gh release edit "$TAG" --notes-file /tmp/release_notes.md
          fi

          # Upload Full and Slim APK assets
          gh release upload "$TAG" McMurdoStationMap-full.apk McMurdoStationMap-slim.apk --clobber
